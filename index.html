<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>장안고 스킨 장애물 피하기</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111827;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: Arial, "Noto Sans KR", sans-serif;
}

#gameBox {
    position: relative;
    width: min(900px, 95vw);
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border: 4px solid #facc15;
    border-radius: 18px;
    background: #87ceeb;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

#score {
    position: absolute;
    top: 15px;
    left: 20px;
    color: white;
    font-size: 25px;
    font-weight: bold;
    text-shadow: 2px 2px 4px #000;
}

#menu {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.panel {
    background: rgba(17, 24, 39, 0.92);
    padding: 30px 45px;
    border-radius: 20px;
    color: white;
}

button {
    border: none;
    padding: 12px 25px;
    border-radius: 10px;
    background: #facc15;
    color: #111827;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #fde047;
}
</style>
</head>

<body>

<div id="gameBox">

    <canvas id="game" width="900" height="506"></canvas>

    <div id="score">
        점수: <span id="scoreNumber">0</span>
    </div>

    <div id="menu">
        <div class="panel">
            <h1>장안고 장애물 피하기</h1>
            <p>스페이스바 또는 클릭으로 점프!</p>
            <button onclick="startGame()">게임 시작</button>
        </div>
    </div>

</div>

<script>

/* =========================================
   장안고 마크
   GitHub에 올릴 때 이 HTML과 같은 폴더에
   logo.png 파일을 넣어주세요.
   ========================================= */

const logo = new Image();
logo.src = "logo.png";


/* =========================================
   게임 기본 설정
   ========================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;

const scoreNumber = document.getElementById("scoreNumber");
const menu = document.getElementById("menu");


/* =========================================
   플레이어
   ========================================= */

const player = {
    x: 150,
    y: HEIGHT / 2,
    size: 62,

    velocity: 0,

    gravity: 0.42,
    jumpPower: -8.2
};


/* =========================================
   게임 상태
   ========================================= */

let gameRunning = false;
let gameOver = false;

let score = 0;
let frame = 0;

let speed = 3.7;

let obstacles = [];


/* =========================================
   게임 시작
   ========================================= */

function startGame() {

    player.y = HEIGHT / 2;
    player.velocity = 0;

    score = 0;
    frame = 0;

    speed = 3.7;

    obstacles = [];

    scoreNumber.textContent = score;

    gameOver = false;
    gameRunning = true;

    menu.style.display = "none";
}


/* =========================================
   점프
   ========================================= */

function jump() {

    if (!gameRunning) {
        startGame();
    }

    if (gameOver) {
        startGame();
    }

    player.velocity = player.jumpPower;
}


/* =========================================
   장애물 생성
   ========================================= */

function createObstacle() {

    const gap = 155;

    const minTop = 50;
    const maxTop = HEIGHT - gap - 80;

    const topHeight =
        minTop + Math.random() * (maxTop - minTop);

    obstacles.push({
        x: WIDTH + 30,

        width: 75,

        top: topHeight,

        gap: gap,

        passed: false
    });
}


/* =========================================
   충돌 판정
   ========================================= */

function collision(a, b) {

    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}


/* =========================================
   게임 업데이트
   ========================================= */

function update() {

    if (!gameRunning) {
        return;
    }

    frame++;


    /* 플레이어 물리 */

    player.velocity += player.gravity;

    player.y += player.velocity;


    /* 장애물 생성 */

    if (frame % 105 === 0) {
        createObstacle();
    }


    /* 장애물 이동 */

    for (const obstacle of obstacles) {

        obstacle.x -= speed;


        /* 위쪽 장애물 */

        const topObstacle = {
            x: obstacle.x,
            y: 0,
            width: obstacle.width,
            height: obstacle.top
        };


        /* 아래쪽 장애물 */

        const bottomObstacle = {
            x: obstacle.x,

            y: obstacle.top + obstacle.gap,

            width: obstacle.width,

            height:
                HEIGHT -
                (obstacle.top + obstacle.gap)
        };


        /* 충돌 */

        const playerBox = {
            x: player.x + 7,
            y: player.y + 7,
            width: player.size - 14,
            height: player.size - 14
        };


        if (
            collision(playerBox, topObstacle) ||
            collision(playerBox, bottomObstacle)
        ) {
            endGame();
        }


        /* 점수 */

        if (
            !obstacle.passed &&
            obstacle.x + obstacle.width < player.x
        ) {

            obstacle.passed = true;

            score++;

            scoreNumber.textContent = score;


            /* 점수가 올라갈수록 조금씩 빨라짐 */

            speed = Math.min(
                7,
                3.7 + score * 0.08
            );
        }
    }


    /* 지나간 장애물 제거 */

    obstacles = obstacles.filter(
        obstacle => obstacle.x + obstacle.width > 0
    );


    /* 천장 / 바닥 충돌 */

    if (
        player.y < 0 ||
        player.y + player.size > HEIGHT
    ) {
        endGame();
    }
}


/* =========================================
   게임 오버
   ========================================= */

function endGame() {

    if (gameOver) {
        return;
    }

    gameOver = true;
    gameRunning = false;

    menu.style.display = "flex";

    menu.innerHTML = `
        <div class="panel">
            <h1>게임 오버!</h1>
            <p>최종 점수</p>
            <h2>${score}</h2>

            <button onclick="startGame()">
                다시 시작
            </button>
        </div>
    `;
}


/* =========================================
   배경
   ========================================= */

function drawBackground() {

    /* 하늘 */

    const sky = ctx.createLinearGradient(
        0,
        0,
        0,
        HEIGHT
    );

    sky.addColorStop(0, "#60a5fa");
    sky.addColorStop(1, "#bfdbfe");

    ctx.fillStyle = sky;

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    /* 구름 */

    ctx.fillStyle = "rgba(255,255,255,0.75)";

    drawCloud(130, 80, 45);
    drawCloud(390, 120, 55);
    drawCloud(720, 70, 45);


    /* 바닥 */

    ctx.fillStyle = "#65a30d";

    ctx.fillRect(
        0,
        HEIGHT - 35,
        WIDTH,
        35
    );

    ctx.fillStyle = "#84cc16";

    ctx.fillRect(
        0,
        HEIGHT - 35,
        WIDTH,
        7
    );
}


function drawCloud(x, y, size) {

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        size * 0.55,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + size * 0.6,
        y + 5,
        size * 0.7,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + size * 1.2,
        y,
        size * 0.5,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* =========================================
   장애물 그리기
   ========================================= */

function drawObstacles() {

    for (const obstacle of obstacles) {

        ctx.fillStyle = "#166534";


        /* 위 */

        ctx.fillRect(
            obstacle.x,
            0,
            obstacle.width,
            obstacle.top
        );


        /* 위쪽 끝 */

        ctx.fillStyle = "#22c55e";

        ctx.fillRect(
            obstacle.x - 7,
            obstacle.top - 16,
            obstacle.width + 14,
            16
        );


        /* 아래 */

        ctx.fillStyle = "#166534";

        ctx.fillRect(
            obstacle.x,

            obstacle.top + obstacle.gap,

            obstacle.width,

            HEIGHT -
            obstacle.top -
            obstacle.gap
        );


        /* 아래쪽 끝 */

        ctx.fillStyle = "#22c55e";

        ctx.fillRect(
            obstacle.x - 7,

            obstacle.top + obstacle.gap,

            obstacle.width + 14,

            16
        );
    }
}


/* =========================================
   장안고 원형 마크 캐릭터
   ========================================= */

function drawPlayer() {

    const x = player.x;
    const y = player.y;
    const size = player.size;


    /* 회전 */

    let rotation =
        Math.max(
            -0.25,
            Math.min(
                0.55,
                player.velocity * 0.035
            )
        );


    ctx.save();

    ctx.translate(
        x + size / 2,
        y + size / 2
    );

    ctx.rotate(rotation);


    /* 원형 캐릭터 */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        size / 2,
        0,
        Math.PI * 2
    );

    ctx.closePath();

    ctx.save();

    ctx.clip();


    /*
       logo.png가 원형 장안고 마크이므로
       캐릭터 전체를 마크로 채움
    */

    if (logo.complete && logo.naturalWidth > 0) {

        ctx.drawImage(
            logo,
            -size / 2,
            -size / 2,
            size,
            size
        );

    } else {

        /* 이미지 로딩 전 임시 표시 */

        ctx.fillStyle = "#a3c63b";

        ctx.fill();
    }

    ctx.restore();


    /* 원형 테두리 */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        size / 2,
        0,
        Math.PI * 2
    );

    ctx.lineWidth = 3;

    ctx.strokeStyle = "#facc15";

    ctx.stroke();


    ctx.restore();
}


/* =========================================
   화면 그리기
   ========================================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

    drawBackground();

    drawObstacles();

    drawPlayer();
}


/* =========================================
   게임 루프
   ========================================= */

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(gameLoop);
}


/* =========================================
   키보드
   ========================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.code === "Space") {

            event.preventDefault();

            jump();
        }
    }
);


/* =========================================
   마우스 / 터치
   ========================================= */

canvas.addEventListener(
    "pointerdown",
    function() {
        jump();
    }
);


/* =========================================
   시작
   ========================================= */

gameLoop();

</script>

</body>
</html>
