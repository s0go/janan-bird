<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jangan Bird</title>

<style>

body {

    margin: 0; min-height: 100vh; background: #0f172a;

    display: flex; justify-content: center; align-items: center; font-family: sans-serif;

}

#gameBox {

    position: relative; width: min(900px, 95vw); aspect-ratio: 16/9;

    overflow: hidden; border: 4px solid #facc15; border-radius: 18px; background: #87ceeb;

}

canvas { width: 100%; height: 100%; display: block; }

#score { position: absolute; top: 15px; left: 20px; color: white; font-size: 25px; font-weight: bold; text-shadow: 2px 2px 4px black; z-index: 5; }

#menu { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 10; }

.panel { width: min(380px, 90%); padding: 25px; background: rgba(17, 24, 39, 0.95); border: 2px solid #facc15; border-radius: 20px; color: white; text-align: center; }

button { border: none; padding: 10px 20px; border-radius: 8px; background: #facc15; color: #111827; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }

button:hover { background: #fde047; }

.btn-del { background: #475569; color: white; font-size: 13px; padding: 6px 12px; }

.btn-del:hover { background: #64748b; }

input { width: 100%; padding: 10px; margin: 10px 0; border: 2px solid #64748b; border-radius: 8px; font-size: 16px; outline: none; box-sizing: border-box; }

input:focus { border-color: #facc15; }

.leaderboard { margin-top: 15px; padding-top: 10px; border-top: 1px solid #475569; text-align: left; font-size: 14px; max-height: 150px; overflow-y: auto; }

.rank { display: flex; justify-content: space-between; padding: 4px 8px; margin-bottom: 3px; background: rgba(255,255,255,0.08); border-radius: 5px; }

.rankScore { color: #facc15; font-weight: bold; }

</style>

</head>

<body>



<div id="gameBox">

    <canvas id="game" width="900" height="506"></canvas>

    <div id="score">점수: <span id="scoreNum">0</span></div>

    <div id="menu"></div>

</div>



<script>

const logo = new Image();

logo.crossOrigin = "anonymous";

logo.src = "logo.png";



const canvas = document.getElementById("game");

const ctx = canvas.getContext("2d");

const scoreNum = document.getElementById("scoreNum");

const menu = document.getElementById("menu");



let bird = { x: 150, y: 250, size: 55, vel: 0, gravity: 0.4, jump: -7.5 };

let pipes = [], score = 0, frame = 0, speed = 3.5, state = "START", playerName = "";



function getLB() {

    try { return JSON.parse(localStorage.getItem("janganLeaderboard")) || []; } catch(e) { return []; }

}

function saveLB(lb) {

    localStorage.setItem("janganLeaderboard", JSON.stringify(lb));

}

function clearLB() {

    if(confirm("리더보드를 초기화할까요?")) {

        localStorage.removeItem("janganLeaderboard");

        showMenu();

    }

}



function showMenu(isGameOver = false, finalScore = 0) {

    menu.style.display = "flex";

    let lb = getLB();

    let lbHtml = `<div class="leaderboard"><b>🏆 TOP 리더보드</b>`;

    if(lb.length === 0) lbHtml += `<p style="text-align:center; color:#94a3b8; margin:8px 0;">기록이 없습니다.</p>`;

    else lb.slice(0, 5).forEach((item, i) => {

        lbHtml += `<div class="rank"><span>${i+1}. ${item.name}</span><span class="rankScore">${item.score}점</span></div>`;

    });

    lbHtml += `</div><button class="btn-del" onclick="clearLB()">초기화</button>`;



    if(!isGameOver) {

        menu.innerHTML = `<div class="panel"><h1>🟢 JANGAN BIRD</h1><p>스페이스바나 화면을 눌러 점프하세요!</p><button onclick="startGame()">게임 시작</button>${lbHtml}</div>`;

    } else {

        menu.innerHTML = `<div class="panel"><h1>💥 게임 오버!</h1><p>점수: <b style="color:#facc15; font-size:24px;">${finalScore}</b></p><input id="pName" placeholder="이름 입력 (최대 10글자)" maxlength="10"><button onclick="submitScore(${finalScore})">점수 등록</button>${lbHtml}</div>`;

        setTimeout(() => document.getElementById("pName")?.focus(), 50);

    }

}



function submitScore(s) {

    let input = document.getElementById("pName");

    let name = input ? input.value.trim() || "익명" : "익명";

    let lb = getLB();

    lb.push({ name, score: s });

    lb.sort((a,b) => b.score - a.score);

    saveLB(lb);

    showMenu(false);

}



function startGame() {

    menu.style.display = "none";

    bird.y = 250; bird.vel = 0;

    pipes = []; score = 0; frame = 0; speed = 3.5;

    scoreNum.textContent = "0";

    state = "PLAYING";

}



function jump() {

    if(state === "START") startGame();

    else if(state === "PLAYING") bird.vel = bird.jump;

    else if(state === "GAMEOVER") showMenu(false);

}



document.addEventListener("keydown", e => { if(e.code === "Space") { e.preventDefault(); jump(); } });

canvas.addEventListener("pointerdown", jump);



function loop() {

    ctx.clearRect(0, 0, 900, 506);



    // 배경 하늘 & 바닥

    ctx.fillStyle = "#60a5fa"; ctx.fillRect(0, 0, 900, 470);

    ctx.fillStyle = "#65a30d"; ctx.fillRect(0, 470, 900, 36);



    if(state === "PLAYING") {

        frame++;

        bird.vel += bird.gravity;

        bird.y += bird.vel;



        if(frame % 100 === 0) {

            let topH = Math.floor(Math.random() * 200) + 60;

            pipes.push({ x: 900, top: topH, bottom: topH + 140, passed: false });

        }



        pipes.forEach(p => {

            p.x -= speed;

            // 충돌 체크

            if(bird.x + bird.size > p.x && bird.x < p.x + 65) {

                if(bird.y < p.top || bird.y + bird.size > p.bottom) {

                    state = "GAMEOVER";

                    showMenu(true, score);

                }

            }

            // 점수 획득

            if(!p.passed && p.x + 65 < bird.x) {

                p.passed = true;

                score++;

                scoreNum.textContent = score;

                speed = Math.min(6.5, 3.5 + score * 0.05);

            }

        });



        pipes = pipes.filter(p => p.x > -80);



        if(bird.y < 0 || bird.y + bird.size > 470) {

            state = "GAMEOVER";

            showMenu(true, score);

        }

    }



    // 파이프 그리기

    pipes.forEach(p => {

        ctx.fillStyle = "#166534";

        ctx.fillRect(p.x, 0, 65, p.top);

        ctx.fillRect(p.x, p.bottom, 65, 506 - p.bottom);

    });



    // 플레이어(로고) 그리기

    ctx.save();

    ctx.translate(bird.x + bird.size/2, bird.y + bird.size/2);

    let rot = Math.max(-0.3, Math.min(0.5, bird.vel * 0.04));

    ctx.rotate(rot);

    ctx.beginPath();

    ctx.arc(0, 0, bird.size/2, 0, Math.PI * 2);

    ctx.clip();



    if(logo.complete && logo.naturalWidth > 0) {

        ctx.drawImage(logo, -bird.size/2, -bird.size/2, bird.size, bird.size);

    } else {

        ctx.fillStyle = "#facc15"; ctx.fill();

    }

    ctx.restore();



    // 테두리

    ctx.save();

    ctx.translate(bird.x + bird.size/2, bird.y + bird.size/2);

    ctx.rotate(rot);

    ctx.beginPath();

    ctx.arc(0, 0, bird.size/2 - 1, 0, Math.PI * 2);

    ctx.lineWidth = 3; ctx.strokeStyle = "#facc15"; ctx.stroke();

    ctx.restore();



    requestAnimationFrame(loop);

}



showMenu();

loop();

</script>

</body>

</html>
