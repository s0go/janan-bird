<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jangan Bird</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body {
    margin: 0; min-height: 100vh; background: #090d16;
    display: flex; justify-content: center; align-items: center; font-family: 'Pretendard', sans-serif;
}
#gameBox {
    position: relative; width: min(900px, 95vw); aspect-ratio: 16/9;
    overflow: hidden; border: 3px solid rgba(250, 204, 21, 0.4); border-radius: 20px; background: #7dd3fc;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
}
canvas { width: 100%; height: 100%; display: block; }
#score { 
    position: absolute; top: 20px; left: 25px; color: white; font-size: 28px; font-weight: 700; 
    text-shadow: 0 2px 8px rgba(0,0,0,0.5); z-index: 5; letter-spacing: -1px;
}
#menu { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 10; backdrop-filter: blur(4px); background: rgba(0,0,0,0.4); }
.panel { 
    width: min(380px, 90%); padding: 30px; background: rgba(15, 23, 42, 0.9); 
    border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; color: white; text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
}
.panel h1 { font-size: 26px; font-weight: 700; margin: 0 0 10px; color: #facc15; letter-spacing: -1px; }
.panel p { font-size: 14px; color: #94a3b8; margin: 0 0 20px; line-height: 1.4; }
button { 
    width: 100%; border: none; padding: 14px; border-radius: 12px; background: #facc15; color: #0f172a; 
    font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(250,204,21,0.3);
}
button:hover { background: #fde047; transform: translateY(-1px); }
.btn-del { 
    background: transparent; color: #94a3b8; font-size: 13px; padding: 8px; margin-top: 12px;
    box-shadow: none; border: 1px solid rgba(255,255,255,0.1);
}
.btn-del:hover { background: rgba(255,255,255,0.05); color: #ef4444; border-color: rgba(239,68,68,0.3); transform: none; }
input { 
    width: 100%; padding: 14px; margin: 0 0 15px; border: 1px solid rgba(255,255,255,0.15); 
    border-radius: 12px; font-size: 16px; outline: none; background: rgba(0,0,0,0.3); color: white;
    box-sizing: border-box; text-align: center;
}
input:focus { border-color: #facc15; box-shadow: 0 0 0 3px rgba(250,204,21,0.2); }
input::placeholder { color: #64748b; }
.leaderboard { margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); text-align: left; font-size: 14px; }
.leaderboard b { display: block; text-align: center; margin-bottom: 10px; color: #e2e8f0; font-size: 15px; }
.rank { display: flex; justify-content: space-between; padding: 8px 12px; margin-bottom: 6px; background: rgba(255,255,255,0.04); border-radius: 8px; align-items: center; }
.rank span:first-child { color: #cbd5e1; }
.rankScore { color: #facc15; font-weight: 700; }
</style>
</head>
<body>

<div id="gameBox">
    <canvas id="game" width="900" height="506"></canvas>
    <div id="score">SCORE <span id="scoreNum">0</span></div>
    <div id="menu"></div>
</div>

<script>
const logo = new Image();
logo.crossOrigin = "anonymous";
logo.src = "logo.png";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreNum = document.getElementById("scoreNum");
const menu = document.getElementById("menu");

let bird = { x: 150, y: 250, size: 55, vel: 0, gravity: 0.4, jump: -7.5 };
let pipes = [], score = 0, frame = 0, speed = 3.5, state = "START";

function getLB() {
    try { return JSON.parse(localStorage.getItem("janganLeaderboard")) || []; } catch(e) { return []; }
}
function saveLB(lb) {
    localStorage.setItem("janganLeaderboard", JSON.stringify(lb));
}
function clearLB() {
    if(confirm("리더보드를 초기화하시겠습니까?")) {
        localStorage.removeItem("janganLeaderboard");
        showMenu();
    }
}

function showMenu(isGameOver = false, finalScore = 0) {
    menu.style.display = "flex";
    let lb = getLB();
    let lbHtml = `<div class="leaderboard"><b>🏆 TOP RANKINGS</b>`;
    if(lb.length === 0) lbHtml += `<p style="text-align:center; color:#64748b; margin:10px 0; font-size:13px;">아직 기록이 없습니다</p>`;
    else lb.slice(0, 5).forEach((item, i) => {
        lbHtml += `<div class="rank"><span>${i+1}. ${item.name}</span><span class="rankScore">${item.score}</span></div>`;
    });
    lbHtml += `</div><button class="btn-del" onclick="clearLB()">기록 초기화</button>`;

    if(!isGameOver) {
        menu.innerHTML = `<div class="panel"><h1>JANGAN BIRD</h1><p>스페이스바나 화면을 눌러 날아오르세요</p><button onclick="startGame()">게임 시작</button>${lbHtml}</div>`;
    } else {
        menu.innerHTML = `<div class="panel"><h1>GAME OVER</h1><p>최종 점수 <b style="color:#facc15; font-size:22px;">${finalScore}</b>점</p><input id="pName" placeholder="이름 입력 (최대 10글자)" maxlength="10"><button onclick="submitScore(${finalScore})">점수 등록하기</button>${lbHtml}</div>`;
        setTimeout(() => document.getElementById("pName")?.focus(), 50);
    }
}

function submitScore(s) {
    let input = document.getElementById("pName");
    let name = input ? input.value.trim() || "익명" : "익명";
    let lb = getLB();
    lb.push({ name, score: s });
    lb.sort((a,b) => b.score - a.score);
    saveLB(lb);
    showMenu(false);
}

function startGame() {
    menu.style.display = "none";
    bird.y = 250; bird.vel = 0;
    pipes = []; score = 0; frame = 0; speed = 3.5;
    scoreNum.textContent = "0";
    state = "PLAYING";
}

function jump() {
    if(state === "START") startGame();
    else if(state === "PLAYING") bird.vel = bird.jump;
    else if(state === "GAMEOVER") showMenu(false);
}

document.addEventListener("keydown", e => { if(e.code === "Space") { e.preventDefault(); jump(); } });
canvas.addEventListener("pointerdown", jump);

function loop() {
    ctx.clearRect(0, 0, 900, 506);

    ctx.fillStyle = "#38bdf8"; ctx.fillRect(0, 0, 900, 470);
    ctx.fillStyle = "#4ade80"; ctx.fillRect(0, 470, 900, 36);

    if(state === "PLAYING") {
        frame++;
        bird.vel += bird.gravity;
        bird.y += bird.vel;

        if(frame % 100 === 0) {
            let topH = Math.floor(Math.random() * 200) + 60;
            pipes.push({ x: 900, top: topH, bottom: topH + 140, passed: false });
        }

        pipes.forEach(p => {
            p.x -= speed;
            // 충돌 체크 (본체 및 뚜껑 테두리 포함)
            if(bird.x + bird.size > p.x && bird.x < p.x + 72) {
                if(bird.y < p.top || bird.y + bird.size > p.bottom) {
                    state = "GAMEOVER";
                    showMenu(true, score);
                }
            }
            if(!p.passed && p.x + 72 < bird.x) {
                p.passed = true;
                score++;
                scoreNum.textContent = score;
                speed = Math.min(6.5, 3.5 + score * 0.05);
            }
        });

        pipes = pipes.filter(p => p.x > -90);

        if(bird.y < 0 || bird.y + bird.size > 470) {
            state = "GAMEOVER";
            showMenu(true, score);
        }
    }

    // 입체적인 파이프 그리기 (본체 + 뚜껑 모자 + 하이라이트/그림자)
    pipes.forEach(p => {
        let pWidth = 64;
        let capH = 26;
        let capExtra = 6;
        let pX = p.x + 4;

        // 1. 윗 파이프 본체
        let gradTop = ctx.createLinearGradient(pX, 0, pX + pWidth, 0);
        gradTop.addColorStop(0, "#14532d");
        gradTop.addColorStop(0.3, "#22c55e");
        gradTop.addColorStop(0.8, "#15803d");
        gradTop.addColorStop(1, "#052e16");

        ctx.fillStyle = gradTop;
        ctx.fillRect(pX, 0, pWidth, p.top - capH);

        // 윗 파이프 테두리선
        ctx.strokeStyle = "#052e16";
        ctx.lineWidth = 3;
        ctx.strokeRect(pX, 0, pWidth, p.top - capH);

        // 윗 파이프 뚜껑 (모자)
        ctx.fillStyle = gradTop;
        ctx.fillRect(pX - capExtra, p.top - capH, pWidth + (capExtra * 2), capH);
        ctx.strokeRect(pX - capExtra, p.top - capH, pWidth + (capExtra * 2), capH);
        
        // 뚜껑 하이라이트 (입체감)
        ctx.fillStyle = "rgba(255,255,255,0.25)";
        ctx.fillRect(pX - capExtra + 3, p.top - capH + 3, 6, capH - 6);

        // 2. 아랫 파이프 본체
        let botY = p.bottom + capH;
        let botHeight = 506 - botY;

        ctx.fillStyle = gradTop;
        ctx.fillRect(pX, botY, pWidth, botHeight);
        ctx.strokeRect(pX, botY, pWidth, botHeight);

        // 아랫 파이프 뚜껑 (모자)
        ctx.fillStyle = gradTop;
        ctx.fillRect(pX - capExtra, p.bottom, pWidth + (capExtra * 2), capH);
        ctx.strokeRect(pX - capExtra, p.bottom, pWidth + (capExtra * 2), capH);

        // 아랫 뚜껑 하이라이트
        ctx.fillStyle = "rgba(255,255,255,0.25)";
        ctx.fillRect(pX - capExtra + 3, p.bottom + 3, 6, capH - 6);
    });

    ctx.save();
    ctx.translate(bird.x + bird.size/2, bird.y + bird.size/2);
    let rot = Math.max(-0.3, Math.min(0.5, bird.vel * 0.04));
    ctx.rotate(rot);
    ctx.beginPath();
    ctx.arc(0, 0, bird.size/2, 0, Math.PI * 2);
    ctx.clip();

    if(logo.complete && logo.naturalWidth > 0) {
        ctx.drawImage(logo, -bird.size/2, -bird.size/2, bird.size, bird.size);
    } else {
        ctx.fillStyle = "#facc15"; ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.translate(bird.x + bird.size/2, bird.y + bird.size/2);
    ctx.rotate(rot);
    ctx.beginPath();
    ctx.arc(0, 0, bird.size/2 - 1, 0, Math.PI * 2);
    ctx.lineWidth = 3; ctx.strokeStyle = "#facc15"; ctx.stroke();
    ctx.restore();

    requestAnimationFrame(loop);
}

showMenu();
loop();
</script>
</body>
</html>
